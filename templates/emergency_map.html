{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
    .container-fluid {
        padding: 0;
        height: 100vh;
        display: flex;
    }
    
    #emergencyMap { 
        height: 100vh;
        width: 70%;
        position: relative;
    }
    
    .control-panel {
        width: 30%;
        height: 100vh;
        background: rgba(26, 26, 46, 0.95);
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    
    .control-section {
        background: rgba(255, 255, 255, 0.05);
        border-radius: var(--border-radius);
        padding: 15px;
        margin-bottom: 15px;
    }
    
    .section-title {
        color: var(--text-light);
        font-size: 1.1rem;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    .emergency-button {
        background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: var(--border-radius);
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: var(--transition);
        width: 100%;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    
    .emergency-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(255, 77, 109, 0.3);
    }
    
    .emergency-button.secondary {
        background: rgba(255, 255, 255, 0.1);
    }
    
    .emergency-description {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: var(--border-radius);
        color: var(--text-color);
        resize: vertical;
        min-height: 60px;
    }
    
    .emergency-timer {
        color: var(--primary-color);
        font-size: 1.1rem;
        text-align: center;
        margin-top: 10px;
        font-weight: bold;
    }
    
    .medical-form {
        display: none;
        background: rgba(255, 255, 255, 0.05);
        padding: 15px;
        border-radius: var(--border-radius);
        margin-top: 10px;
    }
    
    .medical-form input,
    .medical-form textarea {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: var(--border-radius);
        color: var(--text-color);
    }
    
    .emergency-contacts {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    
    .contact-item {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(255, 255, 255, 0.05);
        padding: 10px;
        border-radius: var(--border-radius);
    }
    
    .contact-item button {
        background: none;
        border: none;
        color: var(--text-light);
        cursor: pointer;
        padding: 5px;
    }
    
    .contact-item button:hover {
        color: var(--primary-color);
    }
    
    .hospital-list {
        max-height: 200px;
        overflow-y: auto;
    }
    
    .hospital-item {
        background: rgba(255, 255, 255, 0.05);
        padding: 10px;
        margin-bottom: 8px;
        border-radius: var(--border-radius);
        cursor: pointer;
        transition: var(--transition);
    }
    
    .hospital-item:hover {
        background: rgba(255, 255, 255, 0.1);
    }
    
    .location-request {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(26, 26, 46, 0.95);
        padding: 15px 25px;
        border-radius: var(--border-radius);
        z-index: 1000;
        text-align: center;
    }
    
    .location-request button {
        background: var(--primary-color);
        color: white;
        border: none;
        padding: 8px 20px;
        border-radius: var(--border-radius);
        margin-top: 10px;
        cursor: pointer;
    }
    
    .medical-records-list {
        margin-top: 10px;
        max-height: 200px;
        overflow-y: auto;
    }
    
    .medical-record-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(255, 255, 255, 0.05);
        padding: 10px;
        margin-bottom: 8px;
        border-radius: var(--border-radius);
    }
    
    .record-info {
        flex: 1;
    }
    
    .record-actions {
        display: flex;
        gap: 8px;
    }
    
    .record-actions button {
        background: none;
        border: none;
        color: var(--text-light);
        cursor: pointer;
        padding: 5px;
    }
    
    .record-actions button:hover {
        color: var(--primary-color);
    }
    
    .hospital-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 5px;
    }
    
    .hospital-details {
        font-size: 0.9em;
        color: var(--text-light);
        margin-bottom: 10px;
    }
    
    .hospital-details i {
        width: 20px;
        text-align: center;
        margin-right: 5px;
    }
    
    .select-hospital-btn {
        background: var(--primary-color);
        color: white;
        border: none;
        padding: 5px 10px;
        border-radius: var(--border-radius);
        cursor: pointer;
        font-size: 0.9em;
    }
    
    .hospital-item.selected {
        border: 2px solid var(--primary-color);
    }
    
    .directions-panel {
        max-height: 300px;
        overflow-y: auto;
    }
    
    .direction-step {
        display: flex;
        align-items: center;
        padding: 5px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .step-number {
        background: var(--primary-color);
        color: white;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 10px;
    }
    
    .step-instruction {
        flex: 1;
    }
    
    .step-distance {
        color: var(--text-light);
        font-size: 0.9em;
    }

    .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }

    .modal-content {
        background: var(--bg-color);
        padding: 20px;
        border-radius: var(--border-radius);
        width: 90%;
        max-width: 500px;
    }

    .contact-form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .contact-form input {
        width: 100%;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: var(--border-radius);
        background: rgba(255, 255, 255, 0.1);
        color: var(--text-color);
    }

    .contact-form-buttons {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
    }

    .file-upload-container {
        position: relative;
        margin: 10px 0;
    }

    .file-upload-input {
        display: none;
    }

    .file-upload-label {
        display: block;
        padding: 10px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px dashed rgba(255, 255, 255, 0.2);
        border-radius: var(--border-radius);
        text-align: center;
        cursor: pointer;
        transition: var(--transition);
    }

    .file-upload-label:hover {
        background: rgba(255, 255, 255, 0.15);
    }

    .file-info {
        margin-top: 5px;
        font-size: 0.9em;
        color: var(--text-light);
    }

    .ecg-analysis-section {
        margin-top: 15px;
    }

    .ecg-analysis-section h4 {
        margin-bottom: 10px;
        color: var(--text-light);
    }

    .analysis-result {
        margin-top: 15px;
        padding: 10px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: var(--border-radius);
        display: none;
    }

    .analysis-result.show {
        display: block;
    }

    .analysis-result h5 {
        color: var(--text-light);
        margin-bottom: 10px;
    }

    .analysis-result pre {
        background: rgba(0, 0, 0, 0.2);
        padding: 10px;
        border-radius: var(--border-radius);
        overflow-x: auto;
        white-space: pre-wrap;
        word-wrap: break-word;
    }
    
    .user-location-marker {
        background: transparent !important;
        border: none !important;
    }
    
    .user-location-marker div {
        animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
        0% {
            transform: scale(1);
            opacity: 1;
        }
        50% {
            transform: scale(1.2);
            opacity: 0.8;
        }
        100% {
            transform: scale(1);
            opacity: 1;
        }
    }
</style>
{% endblock %}

{% block content %}

    <div class="control-panel">

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
<script>
    // Utility to safely draw a polyline once the map has a stable size.
    // Uses the canvas renderer (L.canvas) because the default SVG renderer
    // throws "Cannot read properties of undefined (reading 'x')" in
    // _clipPoints when the map was recentered after init (a Leaflet 1.9.4
    // quirk in this environment).
    function safeAddPolyline(coords) {
        const draw = () => {
            if (window.currentRoute) {
                window.map.removeLayer(window.currentRoute);
            }
            window.currentRoute = L.polyline(coords, {
                color: "#4CAF50",
                weight: 5,
                opacity: 0.8,
                renderer: L.canvas()
            }).addTo(window.map);
            try {
                window.map.fitBounds(window.currentRoute.getBounds(), { padding: [20, 20] });
            } catch (boundsError) {
                console.warn('Could not fit bounds, using fallback center:', boundsError);
                window.map.setView(coords[0], 15);
            }
        };

        if (!window.map || !window.map._loaded) {
            window.map.once('load', draw);
        } else {
            setTimeout(draw, 100); // allow layout to settle
        }
    }
    
    // Make functions globally available
    window.selectHospital = function(index) {
        window.selectedHospital = window.nearbyHospitals[index];
        if (window.selectedHospital) {
            // Update the start journey button
            const startJourneyBtn = document.getElementById('startJourney');
            startJourneyBtn.innerHTML = `<i class="fas fa-route"></i> Start Journey to ${window.selectedHospital.name}`;
            startJourneyBtn.disabled = false;
            
            // Highlight selected hospital
            document.querySelectorAll('.hospital-item').forEach((item, i) => {
                item.classList.toggle('selected', i === index);
            });
            
            // Center map on selected hospital
            window.map.setView([window.selectedHospital.lat, window.selectedHospital.lon], 15);
        }
    };

    // OSRM routing (free, no API key needed) — replaces OpenRouteService which
    // required an API key. Uses the public OSRM demo server.
    window.startJourneyToHospital = function(index) {
        const hospital = window.nearbyHospitals[index];
        if (hospital && window.userLocation) {
            // Clear existing route
            if (window.currentRoute) {
                window.map.removeLayer(window.currentRoute);
            }

            // OSRM expects: /route/v1/driving/{lon},{lat};{lon},{lat}?overview=full&geometries=geojson
            const start = `${window.userLocation.lng},${window.userLocation.lat}`;
            const end = `${hospital.lon},${hospital.lat}`;
            const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${start};${end}?overview=full&geometries=geojson&steps=true`;

            fetch(osrmUrl)
                .then(res => {
                    if (!res.ok) {
                        throw new Error(`OSRM API Error: ${res.status} ${res.statusText}`);
                    }
                    return res.json();
                })
                .then(data => {
                    console.log('OSRM route response:', data);

                    if (data.code !== 'Ok' || !data.routes || data.routes.length === 0) {
                        throw new Error(data.message || 'Routing failed. No route returned.');
                    }

                    const route = data.routes[0];
                    const geometry = route.geometry;

                    if (!geometry || !geometry.coordinates || !Array.isArray(geometry.coordinates)) {
                        throw new Error('Route geometry missing from OSRM response.');
                    }

                    // OSRM GeoJSON coordinates are [lon, lat] -> convert to [lat, lon] for Leaflet
                    const finalCoords = geometry.coordinates.map(([lon, lat]) => [lat, lon]);

                    // Safety: remove any non-numeric coordinates
                    const cleanCoords = finalCoords.filter(pt =>
                        Array.isArray(pt) &&
                        Number.isFinite(pt[0]) &&
                        Number.isFinite(pt[1])
                    );

                    if (cleanCoords.length < 2) {
                        throw new Error("Route contains no valid coordinates");
                    }

                    // Draw route on the map
                    safeAddPolyline(cleanCoords);

                    // Build directions from OSRM route steps
                    const formatDistance = (meters) => {
                        if (!Number.isFinite(meters)) return '0 m';
                        if (meters >= 1000) {
                            return `${(meters / 1000).toFixed(1)} km`;
                        }
                        return `${Math.round(meters)} m`;
                    };

                    const formatDuration = (seconds) => {
                        if (!Number.isFinite(seconds)) return '0 min';
                        const mins = Math.round(seconds / 60);
                        if (mins >= 60) {
                            const hrs = Math.floor(mins / 60);
                            const rem = mins % 60;
                            return `${hrs}h ${rem}m`;
                        }
                        return `${mins} min`;
                    };

                    let directionsHTML = '<div class="directions-panel">';
                    directionsHTML += `<h3>Directions to ${hospital.name}</h3>`;
                    directionsHTML += `<p class="route-summary"><strong>Distance:</strong> ${formatDistance(route.distance)} | <strong>Duration:</strong> ${formatDuration(route.duration)}</p>`;
                    directionsHTML += '<div class="directions-list">';

                    // OSRM provides steps in legs[].steps[]
                    const legs = route.legs || [];
                    let stepIndex = 1;
                    let hasSteps = false;

                    legs.forEach(leg => {
                        (leg.steps || []).forEach(step => {
                            hasSteps = true;
                            const maneuver = step.maneuver || {};
                            const type = maneuver.type || 'continue';
                            const modifier = maneuver.modifier || '';
                            const instruction = step.name
                                ? `Continue on ${step.name}`
                                : 'Continue';

                            // Build a human-readable instruction from the maneuver
                            let stepInstruction;
                            if (type === 'depart') {
                                stepInstruction = `Head ${modifier} on ${step.name || 'current road'}`;
                            } else if (type === 'arrive') {
                                stepInstruction = `Arrive at ${hospital.name}`;
                            } else if (type === 'turn') {
                                stepInstruction = `Turn ${modifier} onto ${step.name || 'the road'}`;
                            } else if (type === 'merge') {
                                stepInstruction = `Merge ${modifier} onto ${step.name || 'the road'}`;
                            } else if (type === 'on ramp') {
                                stepInstruction = `Take the ramp ${modifier} onto ${step.name || 'the highway'}`;
                            } else if (type === 'off ramp') {
                                stepInstruction = `Take the exit onto ${step.name || 'the road'}`;
                            } else if (type === 'fork') {
                                stepInstruction = `Keep ${modifier} at the fork onto ${step.name || 'the road'}`;
                            } else if (type === 'roundabout' || type === 'rotary') {
                                stepInstruction = `Enter the roundabout and exit onto ${step.name || 'the road'}`;
                            } else if (type === 'end of road') {
                                stepInstruction = `Turn ${modifier} at the end of ${step.name || 'the road'}`;
                            } else {
                                stepInstruction = `${modifier ? modifier + ' ' : ''}${type.replace(/_/g, ' ')}${step.name ? ' onto ' + step.name : ''}`;
                            }

                            directionsHTML += `
                                <div class="direction-step">
                                    <span class="step-number">${stepIndex}</span>
                                    <span class="step-instruction">${stepInstruction}</span>
                                    <span class="step-distance">${formatDistance(step.distance || 0)}</span>
                                </div>
                            `;
                            stepIndex++;
                        });
                    });

                    if (!hasSteps) {
                        directionsHTML += '<p>Route calculated successfully. Follow the route on the map.</p>';
                    }

                    directionsHTML += '</div></div>';

                    // Create a popup with directions
                    L.popup({maxWidth: 300})
                        .setLatLng([hospital.lat, hospital.lon])
                        .setContent(directionsHTML)
                        .openOn(window.map);
                })
                .catch((error) => {
                    console.error('Error fetching route:', error);
                    alert(`Failed to fetch directions: ${error.message}. Please check your internet connection.`);
                });
        } else if (!window.userLocation) {
            alert('Please enable location access before starting a journey.');
        }
    };
</script>
<script>
    // ---------------------------------------------------------------------------
    // Neon-based contacts (local auth via Flask session).
    // Auth is handled by the Flask session cookie; the /api/emergency_contacts
    // endpoint identifies the user from the session, so no user ID is needed
    // client-side.
    // ---------------------------------------------------------------------------

    // Escape user-supplied text for safe insertion into innerHTML (prevents XSS).
    function escapeHtml(str) {
        if (str == null) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    async function loadUserData() {
        try {
            // Load emergency contacts from Neon
            const contactsResp = await fetch('/api/emergency_contacts');
            if (contactsResp.ok) {
                const data = await contactsResp.json();
                const contacts = data.contacts || {};
                const contactsDiv = document.getElementById('emergencyContacts');
                const addButton = document.getElementById('addContact');
                if (contactsDiv && addButton) {
                    contactsDiv.innerHTML = '';
                    contactsDiv.appendChild(addButton);
                    Object.entries(contacts).forEach(([id, info]) => {
                        const contactElement = document.createElement('div');
                        contactElement.className = 'contact-item';
                        contactElement.dataset.contactId = id;
                        const safeName = escapeHtml(info.name);
                        const safePhone = escapeHtml(info.phone);
                        const safeId = escapeHtml(id);
                        contactElement.innerHTML = `
                            <div class="contact-info">
                                <div class="contact-name">${safeName}</div>
                                <div class="contact-phone">${safePhone}</div>
                            </div>
                            <div class="contact-actions">
                                <button onclick="callContact('${safePhone}')" title="Call"><i class="fas fa-phone"></i></button>
                                <button onclick="removeContact('${safeId}')" title="Remove"><i class="fas fa-trash"></i></button>
                            </div>
                        `;
                        contactsDiv.insertBefore(contactElement, addButton);
                    });
                }
            }

            // Load medical info (medications + allergies) from Neon
            const medResp = await fetch('/api/medical_info');
            if (medResp.ok) {
                const medData = await medResp.json();
                const medsEl = document.getElementById('currentMedications');
                const allergiesEl = document.getElementById('allergies');
                if (medsEl) medsEl.value = medData.medications || '';
                if (allergiesEl) allergiesEl.value = medData.allergies || '';
            }

            // Load medical records from Neon
            const recordsResp = await fetch('/api/medical_records');
            if (recordsResp.ok) {
                const recData = await recordsResp.json();
                const records = recData.records || [];
                const recordsList = document.getElementById('medicalRecordsList');
                if (recordsList) {
                    recordsList.innerHTML = '';
                    records.forEach((record) => {
                        const recordElement = document.createElement('div');
                        recordElement.className = 'record-item';
                        recordElement.dataset.recordId = record.id;
                        const dateStr = record.uploaded_at
                            ? new Date(record.uploaded_at).toLocaleDateString()
                            : '';
                        const safeName = escapeHtml(record.name);
                        const safeId = escapeHtml(record.id);
                        recordElement.innerHTML = `
                            <div class="record-info">
                                <div class="record-name">${safeName}</div>
                                <div class="record-date">${dateStr}</div>
                            </div>
                            <div class="record-actions">
                                <button onclick="viewRecord('${safeId}')" title="View"><i class="fas fa-eye"></i></button>
                                <button onclick="downloadRecord('${safeId}')" title="Download"><i class="fas fa-download"></i></button>
                                <button onclick="removeRecord('${safeId}')" title="Remove"><i class="fas fa-trash"></i></button>
                            </div>
                        `;
                        recordsList.appendChild(recordElement);
                    });
                }
            }
        } catch (error) {
            console.error('Error loading user data:', error);
        }
    }

    async function addEmergencyContact(name, phone) {
        try {
            const response = await fetch('/api/emergency_contacts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, phone: phone })
            });
            if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                alert(err.error || 'Error saving contact. Please try again.');
                return;
            }
            // Reload contacts to show the new one
            loadUserData();
        } catch (error) {
            console.error('Error saving contact:', error);
            alert('Error saving contact. Please try again.');
        }
    }

    async function removeContact(contactId) {
        if (!confirm('Are you sure you want to remove this contact?')) return;
        try {
            const response = await fetch('/api/emergency_contacts?id=' + encodeURIComponent(contactId), {
                method: 'DELETE'
            });
            if (!response.ok) {
                alert('Error removing contact. Please try again.');
                return;
            }

                .then(r => r.json())

                });
        }

    // Haversine distance between two coordinates (meters)
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000; // Earth radius in meters
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
    }

    async function findNearbyHospitals() {
        // Query the Overpass API directly from the browser (the backend
        // /api/nearby_hospitals endpoint can't reach overpass-api.de from
        // the sandbox network, but the user's browser can).
        const lat = window.userLocation.lat;
        const lon = window.userLocation.lng;
        const radius = 5000; // 5km search radius

        const query = `[out:json];(node(around:${radius},${lat},${lon})["amenity"="hospital"];way(around:${radius},${lat},${lon})["amenity"="hospital"];relation(around:${radius},${lat},${lon})["amenity"="hospital"];);out center;`;

        try {
            const response = await fetch('https://overpass-api.de/api/interpreter', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'data=' + encodeURIComponent(query)
            });
            const data = await response.json();

            if (!data.elements) {
                console.warn('No hospital data from Overpass');
                return;
            }

            // Process results: extract lat/lon, name, distance
            const hospitals = [];
            for (const el of data.elements) {
                if (!el.tags || el.tags.amenity !== 'hospital') continue;
                const hLat = el.lat || (el.center && el.center.lat);
                const hLon = el.lon || (el.center && el.center.lon);
                if (hLat == null || hLon == null) continue;

                const distance = calculateDistance(lat, lon, hLat, hLon);
                hospitals.push({
                    name: el.tags.name || 'Unnamed Hospital',
                    lat: hLat,
                    lon: hLon,
                    distance: distance,
                    address: (el.tags['addr:street'] || '') + ', ' + (el.tags['addr:city'] || ''),
                    phone: el.tags.phone || '',
                    website: el.tags.website || ''
                });
            }

            // Sort by distance and take the 5 nearest
            hospitals.sort((a, b) => a.distance - b.distance);
            const nearest = hospitals.slice(0, 5);

            if (nearest.length > 0) {
                window.nearbyHospitals = nearest;
                displayHospitals(nearest);

                // Add markers for each hospital
                nearest.forEach((hospital) => {
                    L.marker([hospital.lat, hospital.lon], {
                        icon: L.divIcon({
                            className: 'hospital-marker',
                            html: '<i class="fas fa-hospital" style="color: #4CAF50; font-size: 20px;"></i>'
                        })
                    })
                    .bindPopup('<b>' + hospital.name + '</b><br>' + hospital.address + '<br>Distance: ' + hospital.distance.toFixed(0) + 'm')
                    .addTo(window.map);
                });
            } else {
                console.warn('No hospitals found within ' + radius + 'm');
            }
        } catch (error) {
            console.error('Error finding hospitals via Overpass:', error);
        }
    }

    async function uploadMedicalRecord(file) {
        // Upload a medical record to Neon via /api/medical_records POST.
        // The file content is read and sent as JSON (text or base64 for PDFs).
        try {
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    let content = e.target.result;
                    // For PDFs, e.target.result is a data URL (base64); store as-is.
                    // For text files, e.target.result is the text content.
                    const response = await fetch('/api/medical_records', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: file.name,
                            type: file.type || 'application/octet-stream',
                            content: content
                        })
                    });
                    if (!response.ok) {
                        const err = await response.json().catch(() => ({}));
                        alert(err.error || 'Error uploading medical record. Please try again.');
                        return;
                    }
                    alert('Medical record uploaded successfully');
                    loadUserData();  // Refresh the records list
                } catch (error) {
                    console.error('Error uploading record:', error);
                    alert('Error uploading medical record. Please try again.');
                }
            };
            // Read PDFs as data URLs (base64), other files as text
            if (file.type === 'application/pdf') {
                reader.readAsDataURL(file);
            } else {
                reader.readAsText(file);
            }
        } catch (error) {
            console.error('Error uploading record:', error);
            alert('Error uploading medical record. Please try again.');
        }
    }

            }

    async function downloadRecord(recordId) {
        // Fetch the record content from Neon and trigger a browser download.
        try {
            const response = await fetch('/api/medical_records/' + recordId);
            if (!response.ok) {
                alert('Error downloading record. Please try again.');
                return;
            }
            const record = await response.json();
            // If it's a PDF stored as a data URL, the content is already base64
            if (record.type === 'application/pdf' && record.content && record.content.startsWith('data:')) {
                // Convert data URL to blob
                const res = await fetch(record.content);
                const blob = await res.blob();
                _downloadBlob(blob, record.name);
            } else {
                // Text content
                const blob = new Blob([record.content || ''], { type: record.type || 'text/plain' });
                _downloadBlob(blob, record.name);
            }
        } catch (error) {
            console.error('Error downloading record:', error);
            alert('Error downloading record. Please try again.');
        }
    }

    function _downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

            const seconds = timeLeft % 60;
            timerElement.textContent = `Calling emergency services in: ${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                clearInterval(emergencyTimeout);
                callEmergencyServices();

        }).addTo(window.map);
