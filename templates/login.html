<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Heart Health Analysis System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root[data-theme="dark"] {
            --primary-color: #f03e5f;
            --secondary-color: #f5768d;
            --accent-color: #d1062a;
            --text-color: #ffffff;
            --text-light: #fccad3;
            --background-start: #1a1a2e;
            --background-end: #16213e;
            --card-color: rgba(26, 26, 46, 0.8);
            --border-radius: 12px;
            --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            --transition: all 0.3s ease;
        }

        body {
            background: linear-gradient(135deg, 
                rgba(26, 26, 46, 0.95) 0%,
                rgba(22, 33, 62, 0.95) 50%,
                rgba(209, 6, 42, 0.2) 100%
            );
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: var(--card-color);
            border-radius: var(--border-radius);
            padding: 40px;
            box-shadow: var(--box-shadow);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: var(--primary-color);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .login-header p {
            color: var(--text-light);
            opacity: 0.8;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            padding: 12px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--primary-color);
            color: var(--text-color);
            box-shadow: 0 0 0 2px rgba(240, 62, 95, 0.2);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            border: none;
            color: white;
            padding: 12px;
            border-radius: var(--border-radius);
            width: 100%;
            font-weight: 500;
            margin-top: 10px;
            transition: var(--transition);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(240, 62, 95, 0.3);
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: var(--text-light);
        }

        .register-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .test-credentials {
            margin-top: 16px;
            padding: 12px 14px;
            background: rgba(240, 62, 95, 0.08);
            border: 1px dashed rgba(240, 62, 95, 0.35);
            border-radius: var(--border-radius);
            font-size: 0.85rem;
            color: var(--text-light);
            line-height: 1.5;
        }

        .test-credentials strong {
            color: var(--primary-color);
        }

        .test-credentials code {
            background: rgba(255, 255, 255, 0.1);
            padding: 1px 6px;
            border-radius: 4px;
            color: var(--text-color);
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.82rem;
            user-select: all;
        }

        .alert {
            background: rgba(240, 62, 95, 0.1);
            border: 1px solid rgba(240, 62, 95, 0.2);
            color: var(--text-color);
            border-radius: var(--border-radius);
            padding: 12px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1><i class="fas fa-heartbeat"></i> Login</h1>
            <p>Welcome back to Heart Health Analysis System</p>
        </div>
        
        <div class="alert alert-danger" id="errorAlert" role="alert"></div>
        
        <form id="loginForm">
            <div class="mb-3">
                <input type="email" class="form-control" id="email" placeholder="Email address" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-login">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>
        
        <div class="register-link">
            Don't have an account? <a href="/register">Register here</a>
        </div>

        <div class="test-credentials">
            <strong>Test account:</strong><br>
            Email: <code>leo@gmail.com</code><br>
            Password: <code>leo123</code>
        </div>
    </div>

    <script>
        // Local (Neon-based) authentication. The backend POST /login route
        // verifies the email+password against the Neon users table and sets
        // a Flask server-side session cookie.
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            // Clear any previous error
            errorAlert.style.display = 'none';
            errorAlert.textContent = '';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password }),
                });

                const data = await response.json();

                if (!response.ok || data.status !== 'success') {
                    throw new Error(data.message || 'Login failed. Please try again.');
                }

                // Success -> go to the dashboard
                window.location.href = '/';
            } catch (error) {
                console.error('Login error:', error);
                errorAlert.style.display = 'block';
                errorAlert.textContent = error.message || 'Login failed. Please try again.';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
            }
        });
    </script>
</body>
</html>
