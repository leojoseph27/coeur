services:
  - type: web
    name: coeur
    env: python
    plan: free
    # Python 3.10 is required. The app pins pandas==1.3.3, grpcio==1.48.2,
    # and kiwisolver==1.3.2 — none of which have cp311 wheels. Python 3.10
    # is the highest version with wheels for ALL pinned dependencies.
    buildCommand: >
      python -m pip install --upgrade pip &&
      pip install -r requirements.txt
    # NOTE: use sync worker (not eventlet) — eventlet's monkey-patching
    # segfaults with TensorFlow/PyTorch native libs. Flask-SocketIO runs in
    # threading async mode, which is compatible with the sync worker.
    startCommand: >
      gunicorn app:app
      --bind 0.0.0.0:$PORT
      --timeout 240
      --workers 1
      --threads 4
      --preload
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.14"
      - key: PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION
        value: python
      - key: DEPLOYMENT_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: TF_FORCE_GPU_ALLOW_GROWTH
        value: "true"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
      - key: GUNICORN_CMD_ARGS
        value: "--log-level=info"
      # Required — set these in the Render dashboard (do NOT commit secrets):
      # - NEON_DATABASE_URL  (Neon PostgreSQL connection string)
      # - GOOGLE_API_KEY     (Google Gemini API key)
      # - FLASK_SECRET_KEY   (random secret for session signing)
      # Optional:
      # - DEMO_FILES_DIR     (path to demo file storage; defaults to ./demo_files)
